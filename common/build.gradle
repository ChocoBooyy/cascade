plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-common"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    maven { url 'https://maven.parchmentmc.org' }
}

neoForge {
    // 26.1 is unobfuscated, so no parchment mappings are applied
    neoFormVersion = neo_form_version
}

// this module's own compile runs against plain vanilla, a purity check that keeps the shared code off
// loader-private api. CoreRenderTypes is the one deliberate exception: RenderType.create is package-private
// in vanilla but access-widened by BOTH loaders (a neoforge access transformer, fabric's transitive access
// wideners), so the file targets the both-loaders surface instead. the loaders still compile it from the
// shared source through the commonJava source-merge below
tasks.named('compileJava', JavaCompile) {
    exclude '**/client/CoreRenderTypes.java'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
}

dependencies {
    api project(':engine')
}
