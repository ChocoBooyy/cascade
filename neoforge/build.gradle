plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    maven { url 'https://maven.parchmentmc.org' }
}

sourceSets {
    testmod
}

neoForge {
    version = neoforge_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    addModdingDependenciesTo(sourceSets.testmod)
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        cascadetest {
            sourceSet sourceSets.testmod
        }
    }
    runs {
        client {
            client()
        }
        gameTest {
            type = "gameTestServer"
        }
    }
}

configurations {
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
    testmodImplementation.extendsFrom(implementation)
    testmodRuntimeOnly.extendsFrom(runtimeOnly)
}

dependencies {
    commonJava project(path: ':common', configuration: 'commonJava')
    implementation project(':engine')

    testmodImplementation sourceSets.main.output
    testmodImplementation project(':engine')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    def expandProps = [
            version                      : project.version,
            minecraft_version_range      : minecraft_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range
    ]
    inputs.properties(expandProps)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand expandProps
    }
}

// runs load the dev testmod, so its classes and the mods.toml in its resources must be built
// first; moddev wires this for the main mod but not the extra source set
tasks.named('runClient') {
    dependsOn 'testmodClasses'
}
tasks.named('runGameTest') {
    dependsOn 'testmodClasses'
}
