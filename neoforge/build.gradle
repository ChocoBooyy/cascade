plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    maven { url 'https://maven.parchmentmc.org' }
}

sourceSets {
    // the shared demos compile into the testmod, the same source the fabric testmod builds from
    testmod {
        java.srcDir "$rootDir/testmod-shared/java"
    }
    // the shader asset lint keeps its own mc-free source set; the default test set belongs to the
    // fml junit codec suite, which needs the full modding classpath
    shaderLint
    // package the shared assets (core shaders) that live in :common, the resource twin of the java source-merge
    main {
        resources {
            srcDir project(':common').file('src/main/resources')
        }
    }
    // the codec suite parses the shipped datapack effects; data only, the testmod mods.toml must
    // not leak onto the junit classpath or fml would try to load a mod with no classes
    test {
        resources {
            srcDir file('src/testmod/resources')
            include 'data/**'
        }
    }
}

neoForge {
    // 26.1 is unobfuscated, so no parchment mappings are applied
    version = neoforge_version
    addModdingDependenciesTo(sourceSets.testmod)
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        cascadetest {
            sourceSet sourceSets.testmod
        }
    }
    // fml junit: the codec suite runs with the game bootstrapped, so real registry byte bufs and
    // dfu json ops work; this is the only automated coverage of the json+wire spec path (the
    // gametest server bails before any datapack load)
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
    runs {
        client {
            client()
        }
        gameTest {
            type = "gameTestServer"
        }
    }
}

configurations {
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
    engineJava {
        canBeResolved = true
        canBeConsumed = false
    }
    testmodImplementation.extendsFrom(implementation)
    testmodRuntimeOnly.extendsFrom(runtimeOnly)
}

dependencies {
    commonJava project(path: ':common', configuration: 'commonJava')
    engineJava project(path: ':engine', configuration: 'engineJava')

    testmodImplementation sourceSets.main.output

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // the shader asset lint reads json+glsl as text, so it stays off the modding classpath
    shaderLintImplementation platform('org.junit:junit-bom:5.10.2')
    shaderLintImplementation 'org.junit.jupiter:junit-jupiter'
    shaderLintImplementation 'com.google.code.gson:gson:2.10.1'
    shaderLintRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// the jar is self-contained, so its javadoc should cover the merged common and engine api too, mirroring
// the compileJava source-merge below. missing-comment noise is dropped (internals are undocumented on
// purpose) while link and syntax checks still fail on a broken reference
javadoc {
    source(configurations.commonJava)
    source(configurations.engineJava)
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

// the sources jar covers the merged api too, so the published artifact is browsable end to end
tasks.named('sourcesJar') {
    from(configurations.commonJava)
    from(configurations.engineJava)
}

tasks.register('shaderLint', Test) {
    description = 'Lints core shader assets against the ShaderInstance load contract.'
    group = 'verification'
    testClassesDirs = sourceSets.shaderLint.output.classesDirs
    classpath = sourceSets.shaderLint.runtimeClasspath
    useJUnitPlatform()
}
tasks.named('check') {
    dependsOn 'shaderLint'
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava, configurations.engineJava)
    source(configurations.commonJava)
    source(configurations.engineJava)
}

processResources {
    def expandProps = [
            version                      : project.version,
            minecraft_version_range      : minecraft_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range
    ]
    inputs.properties(expandProps)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand expandProps
    }
}

// runs load the dev testmod, so its classes and the mods.toml in its resources must be built
// first; moddev wires this for the main mod but not the extra source set
tasks.named('runClient') {
    dependsOn 'testmodClasses'
}

// a standalone jar of the dev harness, for exercising a published cascade jar in a real launcher;
// never published
tasks.register('testmodJar', Jar) {
    from sourceSets.testmod.output
    archiveBaseName = "${mod_id}-testmod"
}
tasks.named('runGameTest') {
    dependsOn 'testmodClasses'
}

// the jar is self-contained (engine and common compile in as sources), so the pom must not
// declare dependencies; moddev's neoforge dep is the consumer's own concern
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
            pom.withXml {
                def deps = asNode().dependencies
                if (!deps.isEmpty()) {
                    asNode().remove(deps)
                }
            }
        }
    }
    repositories {
        // a local clone of the ChocoBooyy/maven repo; push it after publishing, consumers read it over raw
        maven {
            name = 'chocoboy'
            url = uri("${rootDir}/../maven")
        }
    }
}
