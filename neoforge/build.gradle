plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
    maven { url 'https://maven.parchmentmc.org' }
}

sourceSets {
    testmod
}

neoForge {
    version = neoforge_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    addModdingDependenciesTo(sourceSets.testmod)
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        cascadetest {
            sourceSet sourceSets.testmod
        }
    }
    runs {
        client {
            client()
        }
        gameTest {
            type = "gameTestServer"
        }
    }
}

configurations {
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
    engineJava {
        canBeResolved = true
        canBeConsumed = false
    }
    testmodImplementation.extendsFrom(implementation)
    testmodRuntimeOnly.extendsFrom(runtimeOnly)
}

dependencies {
    commonJava project(path: ':common', configuration: 'commonJava')
    engineJava project(path: ':engine', configuration: 'engineJava')

    testmodImplementation sourceSets.main.output

    // the shader asset lint reads json+glsl as text, so it stays off the modding classpath
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava, configurations.engineJava)
    source(configurations.commonJava)
    source(configurations.engineJava)
}

processResources {
    def expandProps = [
            version                      : project.version,
            minecraft_version_range      : minecraft_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range
    ]
    inputs.properties(expandProps)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand expandProps
    }
}

// runs load the dev testmod, so its classes and the mods.toml in its resources must be built
// first; moddev wires this for the main mod but not the extra source set
tasks.named('runClient') {
    dependsOn 'testmodClasses'
}
tasks.named('runGameTest') {
    dependsOn 'testmodClasses'
}
