plugins {
    id 'java-library'
    id 'me.champeau.jmh' version '0.7.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// benchmarks are a measurement tool, not a correctness gate: slow by nature and machine-dependent,
// so they stay off the check/build graph and run only via an explicit :engine:jmh
jmh {
    warmupIterations = 3
    warmup = '1s'
    iterations = 5
    timeOnIteration = '1s'
    fork = 1
}

// expose the source so the loader modules can compile it into their own mod module; a plain jar
// dependency is a separate module that FML will not let the mod read at runtime
configurations {
    engineJava {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    engineJava sourceSets.main.java.sourceDirectories.singleFile
}
