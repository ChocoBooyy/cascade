plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// expose the source so the loader modules can compile it into their own mod module; a plain jar
// dependency is a separate module that FML will not let the mod read at runtime
configurations {
    engineJava {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    engineJava sourceSets.main.java.sourceDirectories.singleFile
}
