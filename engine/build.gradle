plugins {
    id 'java-library'
    id 'maven-publish'
    id 'me.champeau.jmh' version '0.7.2'
}

// published under the cascade-* coordinate family, matching cascade-neoforge. note the neoforge jar
// already embeds these classes: a consumer picks one, either engine alone or a loader module
base {
    archivesName = "${mod_id}-engine"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// the public api carries javadoc; internals deliberately do not, so drop the missing-comment noise but keep
// link and syntax checking so a broken reference still fails
javadoc {
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

// benchmarks are a measurement tool, not a correctness gate: slow by nature and machine-dependent,
// so they stay off the check/build graph and run only via an explicit :engine:jmh
jmh {
    warmupIterations = 3
    warmup = '1s'
    iterations = 5
    timeOnIteration = '1s'
    fork = 1
}

// expose the source so the loader modules can compile it into their own mod module; a plain jar
// dependency is a separate module that FML will not let the mod read at runtime
configurations {
    engineJava {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    engineJava sourceSets.main.java.sourceDirectories.singleFile
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        // a local clone of the ChocoBooyy/maven repo; push it after publishing, consumers read it over raw
        maven {
            name = 'chocoboy'
            url = uri("${rootDir}/../maven")
        }
    }
}
