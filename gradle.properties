org.gradle.jvmargs=-Xmx2G
org.gradle.caching=true

mod_id=cascade
mod_name=Cascade
mod_version=1.0.0
mod_group=dev.chocoboy.cascade
mod_license=MIT

# Minecraft 26.1 port. 26.1 ships UNOBFUSCATED, so there are no mappings or parchment here, a real
# simplification over the 1.21.1 build. Building 26.1 needs a Java 25 JDK (the 1.21.1 build used 21).
# See the porting notes for the tooling and the render work still needed.
minecraft_version=26.1.2
minecraft_version_range=[26.1,27)
java_version=25

neoforge_version=26.1.2.76
neoforge_loader_version_range=[4,)
neo_form_version=26.1.2-1

fabric_loader_version=0.19.2
fabric_api_version=0.148.0

