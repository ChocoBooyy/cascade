plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

base {
    archivesName = "${mod_id}-fabric"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    // package the shared assets (core shaders) that live in :common, the resource twin of the java source-merge
    main {
        // the shared testmod demos, dev-guarded at runtime; same source as the neoforge testmod
        java {
            srcDir "$rootDir/testmod-shared/java"
        }
        resources {
            srcDir project(':common').file('src/main/resources')
        }
    }
}

configurations {
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
    engineJava {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // 26.1 ships unobfuscated: loom does not remap, so there is no mappings block and the deps are plain
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    commonJava project(path: ':common', configuration: 'commonJava')
    engineJava project(path: ':engine', configuration: 'engineJava')
}

// compile the shared engine and common sources straight into the fabric jar, the same source-merge the
// neoforge module uses, so both loaders ship one copy of the core
tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava, configurations.engineJava)
    source(configurations.commonJava)
    source(configurations.engineJava)
}

processResources {
    def props = [version: project.version]
    inputs.properties(props)
    filesMatching('fabric.mod.json') {
        expand props
    }
}

// merged javadoc and the same dependency-free pom as the neoforge artifact: the jar is
// self-contained, engine and common compile in as sources
tasks.named('javadoc', Javadoc) {
    dependsOn(configurations.commonJava, configurations.engineJava)
    source(configurations.commonJava)
    source(configurations.engineJava)
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}
tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava, configurations.engineJava)
    from(configurations.commonJava)
    from(configurations.engineJava)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// gradle module metadata would re-declare the loader and fabric-api as runtime deps, defeating the
// dependency-free pom; consumers resolve those themselves like on neoforge
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
            pom.withXml {
                def deps = asNode().dependencies
                if (!deps.isEmpty()) {
                    asNode().remove(deps)
                }
            }
        }
    }
    repositories {
        // a local clone of the ChocoBooyy/maven repo; push it after publishing, consumers read it over raw
        maven {
            name = 'chocoboy'
            url = uri("${rootDir}/../maven")
        }
    }
}
